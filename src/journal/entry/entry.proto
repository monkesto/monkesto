syntax = "proto3";

package proto.journal.entry.entry;
import "id/ident.proto";

message ProtoRepeatedTransactionEntryIds {
  repeated id.ident.ProtoIdent entries = 1;
}

message ProtoEntryKind {
  message ProtoActivityEntryKind {
    id.ident.ProtoIdent activity_id = 1;
    id.ident.ProtoIdent fund_id = 2;
    bool transfer = 3;
  }

  oneof proto_entry_kind_variant {
    id.ident.ProtoIdent account = 1;
    ProtoActivityEntryKind activity = 2;
  }
}

message ProtoTransactionEntry {
  uint64 amount = 1;
  int32 entry_side = 2;
  ProtoEntryKind entry_kind = 3;
}

message ProtoRepeatedTransactionEntries {
  repeated ProtoTransactionEntry entries = 1;
}
